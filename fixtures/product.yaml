$schema: "https://json-schema.org/draft/2020-12/schema"
title: Product
type: object
x-primary-key: id
required: [id, name, price, tags, released_on]
properties:
  id:
    type: string
    format: uuid
  name:
    type: string
    minLength: 1
    maxLength: 60
  price:
    type: number
    minimum: 0
    maximum: 9999
  tags:
    type: array
    minItems: 1
    maxItems: 5
    items:
      type: string
      maxLength: 12
  released_on:
    type: string
    format: date
  discontinued:
    type: boolean
