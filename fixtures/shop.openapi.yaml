openapi: 3.0.3
info:
  title: Shop API
  version: "1.0.0"
paths: {}
components:
  schemas:
    customers:
      type: object
      x-primary-key: id
      required: [id, email, full_name, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
          minLength: 2
          maxLength: 80
        created_at:
          type: string
          format: date-time
        orders:
          type: array
          items:
            $ref: "#/components/schemas/orders"
    products:
      type: object
      x-primary-key: id
      required: [id, sku, title, price, in_stock]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
          pattern: "^[A-Z]{3}-[0-9]{4}$"
        title:
          type: string
          minLength: 1
          maxLength: 120
        price:
          type: number
          minimum: 0
          maximum: 10000
        in_stock:
          type: boolean
    orders:
      type: object
      x-primary-key: id
      required: [id, customer_id, placed_at, status]
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          $ref: "#/components/schemas/customers"
        placed_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [new, paid, shipped]
    order_items:
      type: object
      x-primary-key: id
      required: [id, order_id, product_id, quantity, unit_price]
      properties:
        id:
          type: string
          format: uuid
        order_id:
          $ref: "#/components/schemas/orders"
        product_id:
          $ref: "#/components/schemas/products"
        quantity:
          type: integer
          minimum: 1
          maximum: 50
        unit_price:
          type: number
          minimum: 0
          maximum: 10000
